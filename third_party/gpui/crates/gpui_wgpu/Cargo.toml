[package]
name = "gpui_wgpu"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "Apache-2.0"

[lints]
workspace = true

[lib]
path = "src/gpui_wgpu.rs"

[features]
default = []
font-kit = ["dep:font-kit"]

[dependencies]
gpui.workspace = true
anyhow.workspace = true
bytemuck = "1"
collections.workspace = true
cosmic-text = "0.17.0"
etagere = "0.2"
itertools.workspace = true
log.workspace = true
parking_lot.workspace = true
profiling.workspace = true
raw-window-handle = "0.6"
smallvec.workspace = true
swash = "0.2.6"
gpui_util.workspace = true
wgpu.workspace = true

# Optional: only needed on platforms with multiple font sources (e.g. Linux)
# WARNING: If you change this, you must also publish a new version of zed-font-kit to crates.io
font-kit = { git = "https://github.com/zed-industries/font-kit", rev = "94b0f28166665e8fd2f53ff6d268a14955c82269", package = "zed-font-kit", version = "0.14.1-zed", optional = true }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
pollster.workspace = true

# Stage 2 dma-buf import (Linux/FreeBSD): we need to reach into wgpu's
# Vulkan backend via wgpu-hal and call ash directly to wire
# VK_EXT_external_memory_dma_buf + VK_EXT_image_drm_format_modifier into
# a wgpu::Texture. See `src/external_texture_import.rs`.
# wgpu-hal is reached via `wgpu::hal` (it's `pub extern crate wgpu_hal as hal`
# in wgpu/lib.rs), so we don't declare a direct dep — that would create two
# different versions in the crate graph and `wgpu::hal::api::Vulkan` would
# not match the type wgpu uses internally. Same for ash: accessed via
# `wgpu::hal::vulkan` re-exports.
[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
ash = "0.38"
libc.workspace = true

[target.'cfg(target_family = "wasm")'.dependencies]
wasm-bindgen.workspace = true
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["HtmlCanvasElement"] }
js-sys = "0.3"