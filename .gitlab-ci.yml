# tramuntana CI
#
# Two pipelines:
#
# 1. `check-paint-api` — per-push compile gate on a self-hosted runner
#    (the maintainer's workstation, registered with tag `self-hosted`).
#    Servo's transitive deps don't fit in GitLab SaaS free runners, but
#    on the self-hosted box the `target/` cache persists between jobs
#    so incremental rebuilds are ~30s. Cold first run is slow.
#
# 2. `upstream-sync` — weekly cron, runs on GitLab SaaS small runners.
#    Doesn't compile Servo; only fetches and merges. Lives on SaaS so
#    it fires every Monday even if the workstation is off.

stages:
  - check
  - upstream-sync

# ---- Per-push: compile gate on self-hosted runner. ----------------------
#
# tramuntana's Cargo.toml uses `path = "../stylo/..."` for the stylo
# family of crates. The runner clones tramuntana into its workdir, so we
# need to keep a clone of syrakon/stylo as a sibling. On the self-hosted
# runner that sibling already exists across runs after the first clone;
# we `git fetch` to keep it current rather than re-cloning every job.
check-paint-api:
  stage: check
  tags:
    - self-hosted
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "merge_request_event"'
  before_script:
    # Shell executor doesn't run a login shell, so rustup isn't on PATH.
    # The runner user (outsider or gitlab-runner) has rustup installed in
    # ~/.cargo; surface it before invoking rustup/cargo.
    - export PATH="$HOME/.cargo/bin:$PATH"
    # Keep ../stylo up to date (clone first time, fetch+reset every run).
    - |
      if [ -d ../stylo/.git ]; then
        (cd ../stylo && git fetch --depth 1 origin main && git reset --hard origin/main)
      else
        git clone --depth 1 https://gitlab.com/syrakon/stylo.git ../stylo
      fi
    - rustup default 1.94.0
  script:
    - RUST_MIN_STACK=33554432 cargo check -p servo-paint-api --lib

# ---- Weekly: pull from Servo upstream (GitLab SaaS). --------------------
upstream-sync:
  stage: upstream-sync
  image: rust:1.94-slim
  rules:
    # Trigger only on the weekly schedule or when manually run with the
    # RUN_UPSTREAM_SYNC variable set.
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$RUN_UPSTREAM_SYNC == "1"'
      when: manual
  variables:
    # Use the master torii from gitorii's releases. Pinned so a torii
    # regression doesn't break our scheduled syncs silently. Bump
    # deliberately.
    TORII_VERSION: "0.7.6"
    UPSTREAM_REMOTE: "upstream"
    UPSTREAM_URL: "https://github.com/servo/servo.git"
    SYNC_BRANCH: "main"
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends ca-certificates git curl
    # Install torii from crates.io at the pinned version.
    - cargo install gitorii --version $TORII_VERSION --locked
    # CI's clone of $CI_PROJECT_DIR only has origin. Add upstream.
    - torii remote link --name $UPSTREAM_REMOTE --https github servo/servo || true
    # CI identity — committer for the merge commit. Real authorship of
    # each merged commit is preserved from upstream; this is just for the
    # merge commit itself.
    - torii config set user.name "tramuntana-bot"
    - torii config set user.email "ci@syrakon.com"
  script:
    - set -euo pipefail
    - torii sync --fetch $UPSTREAM_REMOTE
    # Stash any leftover CI state.
    - torii branch $SYNC_BRANCH
    # Try to merge. Captured separately so we can branch on the outcome.
    - |
      if torii sync $UPSTREAM_REMOTE/$SYNC_BRANCH --merge; then
        echo "Merge clean. Pushing to origin/$SYNC_BRANCH."
        torii sync --push
      else
        echo "Merge has conflicts. Opening MR for manual resolution."
        # Save the conflicted state on a branch and push so gitlab sees it.
        torii branch upstream-sync-$(date +%Y%m%d) -c
        torii save -am "wip: upstream sync needs manual merge ($(date -I))"
        torii sync --push
        # Best-effort MR creation; manual if gh/glab API is unavailable.
        torii pr create \
          --title "upstream-sync: needs manual merge ($(date -I))" \
          --body "Automatic weekly sync hit a conflict. See SYNCING.md." \
          --label needs-manual-merge || true
        exit 1
      fi
  cache:
    key: cargo-upstream-sync
    paths:
      - .cargo/registry/

# Schedule note: configure a weekly pipeline schedule in the GitLab UI
# (Settings → CI/CD → Schedules), with the cron `0 5 * * 1` (Mondays at
# 05:00 UTC) and variable `CI_PIPELINE_SOURCE=schedule`. The job above
# will pick it up via the `rules` matcher.
